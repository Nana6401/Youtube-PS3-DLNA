name: Publish Youtube-PS3-DLNA-V1.0

on:
  push:
    paths:
      - '.github/workflows/publish-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source
        shell: bash
        run: |
          cat release-src/v1.0-final/source.gz.b64.part* | tr -d '\r\n' | base64 -d | gzip -d > ps3_youtube_dlna.py
          echo "96a5b66d09a48160c13b266373de82000485ba89ca4f70a09258958ec6127f9c  ps3_youtube_dlna.py" | sha256sum -c -
          python3 -m py_compile ps3_youtube_dlna.py

      - name: Commit public source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ps3_youtube_dlna.py
          git commit -m "Publish Youtube-PS3-DLNA-V1.0" || true
          git push origin HEAD:main

      - name: Build release archive
        shell: bash
        run: |
          rm -rf release-package
          mkdir -p release-package/Youtube-PS3-DLNA-V1.0
          cp ps3_youtube_dlna.py run_windows.bat run_linux.sh requirements.txt README.md release-package/Youtube-PS3-DLNA-V1.0/
          cd release-package
          zip -r ../Youtube-PS3-DLNA-V1.0.zip Youtube-PS3-DLNA-V1.0

      - name: Create tag
        shell: bash
        run: |
          git tag Youtube-PS3-DLNA-V1.0
          git push origin Youtube-PS3-DLNA-V1.0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create Youtube-PS3-DLNA-V1.0 Youtube-PS3-DLNA-V1.0.zip --title "Youtube-PS3-DLNA-V1.0" --notes-file RELEASE_NOTES_V1.0.md
